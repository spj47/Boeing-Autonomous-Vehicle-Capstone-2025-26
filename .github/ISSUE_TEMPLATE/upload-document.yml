name: "Upload Document to Website"
description: "Upload a file that will automatically appear on the Documents page."
title: "New Document Upload"
body:
  - type: markdown
    attributes:
      value: |
        ## Upload Instructions
        1. Drag and drop your file(s) into this issue.
        2. Fill in the information below.
        3. Submit the issue.

  - type: input
    id: document_name
    attributes:
      label: Document Display Name
      placeholder: "Example: Team Charter"
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Short Description
      placeholder: "Example: Outline of responsibilities"
    validations:
      required: true
