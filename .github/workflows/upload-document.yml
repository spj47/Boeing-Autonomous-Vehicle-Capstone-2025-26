name: Upload Document and Update Page

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  upload:
    if: github.event.issue.title == 'New Document Upload'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create upload folder
        run: mkdir -p uploaded_files Documents

      - name: Download attachments from issue body and comments
        id: download_attachments
        run: |
          # Save issue body
          echo "${{ github.event.issue.body }}" > issue_body.json

          # Extract URLs from issue body
          echo "${{ github.event.issue.body }}" | grep -o 'https://[^"]*\.\(pdf\|docx\|pptx\|xlsx\|zip\|png\|jpg\|txt\)' > file_urls_body.txt || true

          # Get issue comments
          curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            > comments.json

          # Extract URLs from comments
          cat comments.json | grep -o 'https://[^"]*\.\(pdf\|docx\|pptx\|xlsx\|zip\|png\|jpg\|txt\)' > file_urls_comments.txt || true

          # Combine URLs
          cat file_urls_body.txt file_urls_comments.txt > file_urls.txt

          # Download each file
          while read URL; do
            [ -z "$URL" ] && continue
            echo "Downloading $URL"
            curl -L "$URL" -o "uploaded_files/$(basename "$URL")"
          done < file_urls.txt

      - name: Insert each file into Documents
        run: |
          BODY="${{ github.event.issue.body }}"
          DOCNAME="$(echo "$BODY" | awk '/^## Document Display Name/{getline; print}')"
          DESC="$(echo "$BODY" | awk '/^## Short Description/{getline; print}')"
          DATE=$(date +"%m-%d-%Y")

          for FILE in uploaded_files/*; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE")
            EXT="${BASENAME##*.}"

            # Pick icon based on extension
            case "$EXT" in
              pdf) ICON="pdf.png" ;;
              docx) ICON="docx.png" ;;
              pptx) ICON="pptx.png" ;;
              xlsx) ICON="excel.png" ;;
              zip) ICON="zip.png" ;;
              png|jpg|jpeg) ICON="image.png" ;;
              txt) ICON="txt.png" ;;
              *) ICON="file.png" ;;
            esac

            # Move file into Documents folder
            mv "$FILE" "Documents/$BASENAME"

            # Build HTML block
            cat << EOF > new_block.txt
            <div class="card doc-card-horizontal">
             <img src="Images/Icons/$ICON" alt="$EXT File" class="file-icon">
             <div class="doc-details">
              <h3 class="doc-name">$DOCNAME</h3>
              <p class="doc-desc">$DESC</p>
              <p class="doc-date">Added: $DATE</p>
            </div>
            <a href="Documents/$BASENAME" download class="download-btn">Download</a>
          </div>
          EOF

            # Insert **before** IMPORTANT comment
            awk -v block="$(cat new_block.txt)" '/IMPORTANT ---!!/{print block}1' Documents.html > tmp.html && mv tmp.html Documents.html
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Documents Documents.html
          git commit -m "Added document(s) from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: peter-evans/close-issue@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Your document(s) have been uploaded and added to the site!"
